<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Srpski</title>
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1916" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Srpski">
  <link rel="stylesheet" href="css/style.css">
  <script>try { document.documentElement.dataset.mode = localStorage.getItem('srpski.profile') === 'nastya' ? 'nastya' : 'vova'; } catch {}</script>
</head>
<body>
  <div id="modebar" role="tablist" aria-label="Режим">
    <button data-mode="vova">🙋‍♂️ Вова</button>
    <button data-mode="nastya">🙋‍♀️ Настя</button>
  </div>
  <main id="view"></main>
  <nav>
    <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5H15v-5h-6v5H5.5A1.5 1.5 0 0 1 4 19z"/></svg>Сегодня</button>
    <button data-tab="course"><svg viewBox="0 0 24 24"><path d="M9 4 4 6v14l5-2 6 2 5-2V4l-5 2zM9 4v14M15 6v14"/></svg>Курс</button>
    <button data-tab="progress"><svg viewBox="0 0 24 24"><path d="M5 20V12M10 20V7M15 20v-5M20 20V4"/></svg>Прогресс</button>
    <button data-tab="words"><svg viewBox="0 0 24 24"><path d="M6 4h10a2 2 0 0 1 2 2v14H8a2 2 0 0 1-2-2zM6 18a2 2 0 0 1 2-2h10M10 8h4"/></svg>Слова</button>
    <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg>Ещё</button>
  </nav>
  <script type="module" src="js/app.js"></script>
</body>
</html>
